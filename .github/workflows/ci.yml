name: CI

on:
  push:
    branches: [main, fix/feeder-payment-cap-20261111]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify published SQLite driver backport
        run: python3 deploy/scripts/verify-sqlite-vendor.py

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Verify state and financial-review files with actual root ownership
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-features --lib --no-run --message-format=json > "$RUNNER_TEMP/native-test-artifacts.jsonl"
          python3 deploy/scripts/test-failed-cost-approval.py "$RUNNER_TEMP/native-test-artifacts.jsonl"

      - name: Verify inactive cross-host preparation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-features --example prepare_cross_host
          cargo run --locked --all-features --example prepare_cross_host -- "$RUNNER_TEMP/cross-host-seed" "$GITHUB_SHA" > "$RUNNER_TEMP/CROSS-HOST-PREPARED.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["seed_sats"] == 2340 and v["started"] is False and v["payment_received_events"] == 1' "$RUNNER_TEMP/CROSS-HOST-PREPARED.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-host-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/CROSS-HOST-PREPARED.json
          if-no-files-found: error
          retention-days: 14
