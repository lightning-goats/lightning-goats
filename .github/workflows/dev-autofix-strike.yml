name: Temporary Strike Branch Autofix

on:
  push:
    branches: [phase1/strike-receive-client]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/strike-receive-client
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - name: Format and refresh lockfile
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --all-features
      - name: Commit mechanical changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo 'No mechanical changes required'
            exit 0
          fi
          git commit -m 'Apply rustfmt and refresh Cargo.lock'
          git push origin HEAD:phase1/strike-receive-client
