name: Format CLN removal once

on:
  push:
    branches:
      - phase1/remove-cln-runtime

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/remove-cln-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'Apply rustfmt after CLN removal'
          git push origin HEAD:phase1/remove-cln-runtime
