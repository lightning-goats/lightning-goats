name: Home held canary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  held-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deploy/openhab/tests/held-canary.test.cjs
      - run: python3 -B -m unittest discover -s deploy/tests -p test_held_canary.py -v
