name: Home owner candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deploy/openhab/tests/owner-v2.test.cjs
      - run: python3 -B -m unittest discover -s deploy/tests -p 'test_owner_v2_fixture.py' -v
