name: Home staging filter
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - run: sudo unshare --net -- python3 -B deploy/nftables/test-home-staging.py
      - run: sudo unshare --net -- python3 -B deploy/nftables/test-home-staging.py --held
      - run: python3 -B -m unittest discover -s deploy/tests -p test_home_staging_drift.py -v
