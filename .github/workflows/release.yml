name: Release Linux binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  rust:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
  deployment:
    uses: ./.github/workflows/deployment.yml
    permissions:
      contents: read
  release:
    needs: [rust, security, deployment]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require an integrated source commit
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Build release binaries
        run: cargo build --release --locked --bins

      - name: Assemble release artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/scripts/package-release.sh target/release "$RUNNER_TEMP/release" "$GITHUB_REF_NAME"
          (cd "$RUNNER_TEMP/release" && sha256sum --check SHA256SUMS)
          python3 deploy/scripts/smoke-release.py "$RUNNER_TEMP/release/lightning-goats-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz" "$(git rev-parse HEAD)"

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ runner.temp }}/release/*"
          artifactErrorsFailBuild: true
          allowUpdates: false
          immutableCreate: true
          generateReleaseNotes: true
