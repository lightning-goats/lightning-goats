name: RustSec lock refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-rustls-lock:
    if: github.head_ref == 'lead/rustsec-2026-0285-20260914'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - name: Update vulnerable rustls lock entry
        run: cargo update -p rustls --precise 0.23.45
      - name: Verify locked tests before recording refresh
        run: cargo test --locked
      - name: Record generated lockfile on the dedicated fix branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock did not change" >&2
            exit 1
          fi
          git diff -- Cargo.lock
          git config user.name 'chatgpt-project-lead'
          git config user.email '792024+santyr@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'security: update rustls for RUSTSEC-2026-0285'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
