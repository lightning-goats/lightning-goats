name: Temporary canary feeder helper

on:
  push:
    branches:
      - feat/canary-deployment-ready

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canary-deployment-ready
      - name: Patch feeder mode check
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/feeder/mod.rs")
          text = path.read_text()
          old = "    if mode == RuntimeMode::Shadow {\n"
          new = "    if !mode.feeder_enabled() {\n"
          if old not in text:
              raise SystemExit("feeder shadow gate not found")
          path.write_text(text.replace(old, new, 1))
      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-canary-feeder.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feeder/mod.rs .github/workflows/temporary-canary-feeder.yml
          git commit -m "refactor: gate feeder by runtime capability"
          git push origin HEAD:feat/canary-deployment-ready
