name: Temporary canary rustfmt

on:
  push:
    branches:
      - feat/canary-deployment-ready

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canary-deployment-ready
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - run: cargo fmt --all
      - run: rm .github/workflows/temporary-fmt-canary.yml
      - name: Commit formatter changes and self-removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' .github/workflows/temporary-fmt-canary.yml
          git commit -m "style: format canary deployment changes"
          git push origin HEAD:feat/canary-deployment-ready
