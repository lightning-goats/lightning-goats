name: Temporary rustfmt fix

on:
  push:
    branches:
      - feat/legacy-lnbits-reconciler

permissions:
  contents: write

concurrency:
  group: temporary-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legacy-lnbits-reconciler
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatter changes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply cargo fmt"
          git push origin HEAD:feat/legacy-lnbits-reconciler
