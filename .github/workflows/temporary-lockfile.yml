name: Temporary lockfile generation

on:
  push:
    branches:
      - feat/canary-deployment-ready

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canary-deployment-ready
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Generate Rust 1.88 lockfile
        run: cargo generate-lockfile
      - name: Verify RSA advisory crate is absent from resolved graph
        shell: bash
        run: |
          if grep -q '^name = "rsa"$' Cargo.lock; then
            echo "rsa remains in Cargo.lock after removing unused SQLx macros" >&2
            cargo tree -i rsa --target all || true
            exit 1
          fi
      - name: Verify build and tests against lockfile
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Remove diagnostic and temporary workflows
        run: |
          rm -f .github/workflows/diagnose-rsa.yml
          rm -f .github/workflows/temporary-lockfile.yml
      - name: Commit verified lockfile and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows
          git commit -m "build: commit verified Rust 1.88 lockfile"
          git push origin HEAD:feat/canary-deployment-ready
