name: Temporary lockfile generation

on:
  push:
    branches:
      - feat/canary-deployment-ready

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canary-deployment-ready
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Generate Rust 1.88 lockfile
        run: cargo generate-lockfile
      - name: Verify advisory RSA crate is unreachable
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(cargo tree --locked -i rsa --all-features 2>&1 || true)"
          printf '%s\n' "$TREE"
          if printf '%s\n' "$TREE" | grep -Eq '^rsa v|^[[:space:]│├└─]*rsa v'; then
            echo "rsa is active in the dependency graph" >&2
            exit 1
          fi
      - name: Verify build and tests against lockfile
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Remove diagnostic and temporary workflows
        run: |
          rm -f .github/workflows/diagnose-rsa.yml
          rm -f .github/workflows/temporary-lockfile.yml
      - name: Commit verified lockfile and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows
          git commit -m "build: commit verified Rust 1.88 lockfile"
          git push origin HEAD:feat/canary-deployment-ready
