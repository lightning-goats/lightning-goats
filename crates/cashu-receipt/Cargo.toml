[package]
name = "lightning-goats-cashu-receipt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
lightning-goats-nostr-event = { path = "../nostr-event", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
