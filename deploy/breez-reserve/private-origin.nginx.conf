daemon off;
worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    upstream goats_cashu_mint {
        server unix:/run/lightning-goats-reserve/mainnet/mint/http.sock;
    }
    upstream goats_reserve_receive {
        server unix:/run/lightning-goats-reserve/mainnet/receive/http.sock;
    }

    server {
        listen 10.8.0.6:8793 ssl;
        server_name mint-home.internal;
        allow 10.8.0.1;
        deny all;
        proxy_next_upstream off;
        ssl_certificate /run/credentials/lightning-goats-private-origin.service/home.pem;
        ssl_certificate_key /run/credentials/lightning-goats-private-origin.service/home.key;
        ssl_client_certificate /run/credentials/lightning-goats-private-origin.service/private-client-ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16k;
        access_log off;
        location = /wallet/health { proxy_pass http://goats_reserve_receive/health; }
        location = /wallet/v1/invoices { proxy_pass http://goats_reserve_receive/v1/invoices; }
        location ~ "^/wallet/v1/invoices/[0-9a-f]{64}$" {
            rewrite ^/wallet(/.*)$ $1 break;
            proxy_pass http://goats_reserve_receive;
        }
        location = /private/v1/project-quotes { proxy_pass http://goats_cashu_mint; }
        location / { return 404; }
    }
}
