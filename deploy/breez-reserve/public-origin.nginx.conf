daemon off;
worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    map $http_upgrade $goats_mint_connection {
        default upgrade;
        '' close;
    }
    upstream goats_cashu_mint {
        server unix:/run/lightning-goats-reserve/mainnet/mint/http.sock;
    }
    server {
        listen 10.8.0.6:8792 ssl;
        server_name mint-home.internal;
        allow 10.8.0.1;
        deny all;
        ssl_certificate /run/credentials/lightning-goats-mint-origin.service/home.pem;
        ssl_certificate_key /run/credentials/lightning-goats-mint-origin.service/home.key;
        ssl_client_certificate /run/credentials/lightning-goats-mint-origin.service/public-edge-client-ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 256k;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $goats_mint_connection;
        proxy_set_header Authorization "";
        proxy_next_upstream off;
        proxy_read_timeout 65s;
        include /run/credentials/lightning-goats-mint-origin.service/public-routes.conf;
    }
}
