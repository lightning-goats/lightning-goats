# Replace GOATS_MINT_SCHEME with http on HOME or https on the VPS when installing.
location ~ ^/v1/(info|keys(/[0-9a-fA-F]+)?|keysets|ws)$ {
    limit_except GET { deny all; }
    proxy_pass GOATS_MINT_SCHEME://goats_cashu_mint;
}
location ~ "^/v1/(mint|melt)/quote/bolt11/(goats-)?[0-9a-fA-F-]{36}$" {
    limit_except GET { deny all; }
    proxy_pass GOATS_MINT_SCHEME://goats_cashu_mint;
}
location ~ ^/v1/(mint/bolt11(/batch)?|melt/bolt11|(mint|melt)/quote/bolt11|mint/quote/bolt11/check|swap|checkstate|restore)$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass GOATS_MINT_SCHEME://goats_cashu_mint;
}
location / { return 404; }
