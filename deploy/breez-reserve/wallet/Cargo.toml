[package]
name = "lightning-goats-reserve"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["json", "tokio"] }
breez-sdk-spark = { path = "../breez-sdk/core", features = ["sqlite"] }
hex.workspace = true
lightning-invoice = { workspace = true, features = ["std"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
bitcoin.workspace = true
tempfile = "3.20"
