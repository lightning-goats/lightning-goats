[package]
name = "lightning-goats-cashu-compat"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
default-run = "lightning-goats-cashu-compat"

# Deliberately separate dependency graph: do not upgrade the running core.
[workspace]

[dependencies]
lightning-goats-cashu-receipt = { path = "../../crates/cashu-receipt", version = "=0.1.0" }
lightning-goats-nostr-event = { path = "../../crates/nostr-event", version = "=0.1.0" }
anyhow = "1"
hex = "=0.4.3"
base64 = "=0.22.1"
ciborium = "=0.2.2"
zeroize = "=1.9.1"
async-trait = "0.1"
futures-util = "=0.3.34"
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
cdk-http-client = { version = "=0.18.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cdk = { version = "=0.18.3", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "=0.18.3", default-features = false, features = ["wallet"] }
rusqlite = { version = "=0.31.0", features = ["bundled", "backup"] }
url = "2"
sha2 = "0.10"
rustix = { version = "1", features = ["fs", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync", "signal", "process"] }

[patch.crates-io]
cdk = { path = "vendor/cdk-0.18.3" }
# Sole dependency pin change; source and archive verified by verify_vendor.py.
rusqlite = { path = "vendor/rusqlite-0.31.0" }

# LDK debug symbols otherwise cause heavy swapping on the small build host.
[profile.dev.package.lightning]
debug = 0
